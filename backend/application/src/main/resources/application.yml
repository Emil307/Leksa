spring:
  application:
    name: uwords
  main:
    banner-mode: "off"
  threads:
    virtual:
      enabled: true
  mvc:
    problemdetails:
      enabled: false
  web:
    resources:
      add-mappings: false
  jackson:
    serialization:
      write-dates-as-timestamps: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.xml

server:
  address: ${BACKEND_HOST:0.0.0.0}
  port: ${BACKEND_PORT:8000}
  max-http-request-header-size: 16KB
  error:
    whitelabel:
      enabled: false
  servlet:
    encoding:
      charset: UTF-8
      force: true
    session:
      tracking-modes: []
      persistent: false

db:
  host: ${DB_HOST:localhost}
  port: ${DB_PORT:5432}
  name: ${DB_NAME:uwords}
  user: ${DB_USER:uwords}
  password: ${DB_PASSWORD:uwords}
  pool-size: ${DB_POOL_SIZE:10}
  statement-timeout-seconds: ${DB_STATEMENT_TIMEOUT_SECONDS:5.0}

redis:
  host: ${REDIS_HOST:localhost}
  port: ${REDIS_PORT:6379}
  password: ${REDIS_PASSWORD:}
  db: ${REDIS_DB:0}

mail:
  host: ${MAIL_HOST:localhost}
  port: ${MAIL_PORT:1025}
  username: ${MAIL_USERNAME:}
  password: ${MAIL_PASSWORD:}
  use-tls: ${MAIL_USE_TLS:false}
  sender: ${MAIL_SENDER:no-reply@uwords.local}
  timeout-millis: ${MAIL_TIMEOUT_MILLIS:60000}

auth:
  token:
    jwt-secret: ${JWT_SECRET:}
    access-token-ttl-seconds: ${ACCESS_TOKEN_TTL_SECONDS:0}
    refresh-token-ttl-seconds: ${REFRESH_TOKEN_TTL_SECONDS:0}
  challenge:
    ttl-seconds: ${AUTH_CHALLENGE_TTL_SECONDS:300}
    max-attempts: ${AUTH_CHALLENGE_MAX_ATTEMPTS:5}
    resend-cooldown-seconds: ${AUTH_CHALLENGE_RESEND_COOLDOWN_SECONDS:60}
    replay-window-seconds: ${AUTH_CHALLENGE_REPLAY_WINDOW_SECONDS:60}
    code-length: ${AUTH_CHALLENGE_CODE_LENGTH:6}
    fixed-code: ${AUTH_CHALLENGE_FIXED_CODE:}
  email-code:
    subject: ${AUTH_EMAIL_CODE_SUBJECT:Код для входа в uwords}
    template-path: ${AUTH_EMAIL_CODE_TEMPLATE_PATH:auth/email_code.html}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:}

logging:
  level:
    root: INFO

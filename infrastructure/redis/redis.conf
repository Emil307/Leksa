# Static hardening for the local-dev Redis. The password is NOT here — it is passed
# at startup (--requirepass) so this file can live in git unchanged.

# --- memory limit: a cache must never eat the host and OOM its neighbours ---
maxmemory 256mb
maxmemory-policy allkeys-lru

# --- pure cache: persistence off ---
save ""
appendonly no
# no RDB/AOF => no dbfilename/dir to redirect a write to

# --- defuse dangerous commands (defence in depth on top of network isolation) ---
rename-command CONFIG ""
rename-command FLUSHALL ""
rename-command FLUSHDB ""
rename-command DEBUG ""
rename-command MODULE ""

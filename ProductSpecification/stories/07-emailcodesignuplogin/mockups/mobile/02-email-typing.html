<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=375">
  <title>Uwords — Почта — заполняется</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    :root { --ink:#0b0712; --panel:#17101f; --field:#211829; --text:#f8f6fb; --muted:#aaa2b5; --violet:#6c35f0; --lime:#dfff4f; --danger:#ff7a8a; --line:rgba(255,255,255,.09); }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--ink); color:var(--text); font-family:Inter,Arial,sans-serif; }
    .mockup-card { width:375px; min-height:812px; margin:0 auto; position:relative; overflow:hidden; background:var(--ink); display:flex; flex-direction:column; }
    .bloom { position:absolute; border-radius:50%; filter:blur(70px); opacity:.55; pointer-events:none; }
    .bloom.v { width:320px; height:320px; background:var(--violet); top:-120px; left:-90px; }
    .bloom.l { width:220px; height:220px; background:var(--lime); top:40px; right:-110px; opacity:.28; }
    .brand { position:relative; z-index:1; padding:28px 22px 0; flex:1; min-height:300px; }
    .logo { font-family:Manrope,Inter,sans-serif; font-weight:800; font-size:22px; letter-spacing:-.02em; }
    .cards { position:relative; height:190px; margin-top:26px; }
    .card { position:absolute; width:200px; padding:14px 16px; border-radius:18px; background:rgba(23,16,31,.7); border:1px solid var(--line); backdrop-filter:blur(8px); }
    .card b { display:block; font-family:Manrope,Inter,sans-serif; font-size:18px; }
    .card span { color:var(--muted); font-size:13px; }
    .card.c1 { left:0; top:0; transform:rotate(-5deg); }
    .card.c2 { left:70px; top:52px; transform:rotate(3deg); }
    .card.c3 { left:130px; top:110px; transform:rotate(-2deg); }
    .tag { position:relative; z-index:1; padding:0 22px 26px; color:var(--muted); font-size:14px; line-height:1.45; }
    .sheet { position:relative; z-index:2; margin-top:-8px; padding:30px 22px 34px; border-radius:32px 32px 0 0; background:rgba(23,16,31,.97); border-top:1px solid var(--line); }
    .grip { width:40px; height:4px; border-radius:2px; background:rgba(255,255,255,.18); margin:-12px auto 22px; }
    h1 { margin:0 0 6px; font-family:Manrope,Inter,sans-serif; font-weight:800; font-size:24px; letter-spacing:-.02em; line-height:1.15; }
    .lead { margin:0 0 22px; color:var(--muted); font-size:15px; line-height:1.45; }
    .lead strong { color:var(--text); font-weight:600; }
    label { display:block; font-size:13px; font-weight:600; color:var(--muted); margin-bottom:8px; }
    .field { display:flex; align-items:center; gap:10px; height:52px; padding:0 16px; border-radius:16px; background:var(--field); border:1px solid var(--line); font-size:16px; }
    .field i { width:20px; height:20px; color:var(--muted); }
    .field.focus { border-color:var(--lime); box-shadow:0 0 0 3px rgba(223,255,79,.18); }
    .field.error { border-color:var(--danger); }
    .field.disabled { opacity:.45; }
    .field .ph { color:#6f6880; }
    .caret { display:inline-block; width:2px; height:20px; background:var(--lime); margin-left:1px; vertical-align:middle; }
    .code { display:flex; gap:8px; }
    .code .cell { flex:1; height:56px; display:grid; place-items:center; border-radius:14px; background:var(--field); border:1px solid var(--line); font-family:Manrope,Inter,sans-serif; font-size:22px; font-weight:700; }
    .code .cell.focus { border-color:var(--lime); }
    .code.error .cell { border-color:var(--danger); }
    .code.disabled .cell { opacity:.45; }
    .msg { display:flex; gap:10px; align-items:flex-start; margin-top:12px; font-size:14px; line-height:1.4; }
    .msg i { width:18px; height:18px; flex:none; margin-top:1px; }
    .msg.error { color:var(--danger); }
    .msg.muted { color:var(--muted); }
    .btn { display:flex; align-items:center; justify-content:center; gap:10px; width:100%; height:54px; margin-top:20px; border-radius:18px; border:0; font:inherit; font-size:16px; font-weight:600; }
    .btn.primary { background:var(--lime); color:var(--ink); }
    .btn.primary.disabled { background:rgba(223,255,79,.28); color:rgba(11,7,18,.7); }
    .btn.primary.busy { background:rgba(223,255,79,.55); color:var(--ink); }
    .btn i { width:20px; height:20px; }
    .spin { width:20px; height:20px; border:2.5px solid rgba(11,7,18,.25); border-top-color:var(--ink); border-radius:50%; animation:s 1s linear infinite; }
    @keyframes s { to { transform:rotate(360deg); } }
    .secondary { display:flex; flex-direction:column; align-items:flex-start; gap:14px; margin-top:20px; font-size:15px; }
    .link { color:var(--text); font-weight:600; text-decoration:none; display:inline-flex; align-items:center; gap:6px; }
    .link i { width:16px; height:16px; }
    .link.off { color:var(--muted); font-weight:500; }
    .note { margin-top:18px; font-size:13px; color:var(--muted); line-height:1.45; text-align:center; }
    .home { position:relative; z-index:1; flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:0 28px; }
    .home .ok { width:72px; height:72px; border-radius:24px; display:grid; place-items:center; background:rgba(223,255,79,.14); border:1px solid rgba(223,255,79,.4); margin-bottom:22px; }
    .home .ok i { width:34px; height:34px; color:var(--lime); }
  </style>
</head>
<body>
  <!-- Story 07: Почта — заполняется. Rules: ProductSpecification/ui/ui-conventions.md; interview.md (mobile only, no Telegram SDK) -->
  <main class="mockup-card">
    <div class="bloom v"></div><div class="bloom l"></div>
    <section class="brand">
      <div class="logo">Uwords</div>
      <div class="cards">
        <div class="card c1"><b>outspoken</b><span>откровенный</span></div>
        <div class="card c2"><b>fluent</b><span>беглый</span></div>
        <div class="card c3"><b>confident</b><span>уверенный</span></div>
      </div>
    </section>
    <p class="tag">Одна почта — один аккаунт на сайте, в Telegram и в боте.</p>
    <section class="sheet">
      <div class="grip"></div>
      <h1>Войти или создать аккаунт</h1>
      <p class="lead">Пришлём код на почту — пароль не нужен.</p>
      <label>Почта</label>
      <div class="field focus"><i data-lucide="mail"></i><span>anna@example.com</span><span class="caret"></span></div>
      <button class="btn primary ">Получить код</button>
      <p class="note">Продолжая, вы соглашаетесь с условиями Uwords.</p>
    </section>

  </main>
  <script>lucide.createIcons();</script>
</body>
</html>

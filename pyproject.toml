# Python here is only the black-box acceptance suite; the backend is Java (see
# ProductSpecification/technology.md). Install with: pip install --group acceptance
[dependency-groups]
acceptance = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "tenacity>=8.2",
    "asyncpg>=0.29",
    "redis>=5.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--import-mode=importlib"
pythonpath = ["acceptance"]
testpaths = ["acceptance"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "backend: black-box acceptance test driven over HTTP",
    "frontend: black-box acceptance test driven through a browser",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

name: ${COMPOSE_PROJECT_NAME:-uwords-bot-0}

services:
  bot:
    build:
      context: ..
      dockerfile: Dockerfile
    command:
      - uvicorn
      - presentation.bot.main:app
      - --host
      - ${BOT_HOST:-0.0.0.0}
      - --port
      - ${BOT_PORT:-18000}
    ports:
      - "127.0.0.1:${BOT_PORT:-18000}:${BOT_PORT:-18000}"
    volumes:
      - ../src/infrastructure/database/migrations/versions:/app/infrastructure/database/migrations/versions
    env_file:
      - ../.env
    environment:
      BOT_HOST: ${BOT_HOST:-0.0.0.0}
      BOT_PORT: ${BOT_PORT:-18000}
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-uwords}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-uwords}
      REDIS_DB: ${REDIS_DB:-0}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:18
    environment:
      POSTGRES_DB: ${DB_NAME:-uwords}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "127.0.0.1:${BOT_DB_PORT:-16432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:8
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:-uwords}
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory
      - 512mb
      - --maxmemory-policy
      - allkeys-lru
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-uwords}
    ports:
      - "127.0.0.1:${BOT_REDIS_PORT:-17379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  adminer:
    image: adminer
    ports:
      - "127.0.0.1:${BOT_ADMINER_PORT:-19080}:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
